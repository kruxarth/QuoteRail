name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quoterail
          POSTGRES_PASSWORD: quoterail
          POSTGRES_DB: quoterail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quoterail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://quoterail:quoterail@localhost:5432/quoterail
      FAKE_AI: 'true'
      FAKE_PAYMENTS: 'true'
      BUYER_MCP_TOKEN: test-buyer-token
      MERCHANT_ADMIN_PASSWORD: test-admin-password
      SESSION_SIGNING_SECRET: test-session-signing-secret-32b
      APP_BASE_URL: http://localhost:3000
      SELLER_MODEL: gpt-5.6-luna
      OPENCODE_GO_BASE_URL: https://opencode.ai/zen/go/v1
      DEMO_RESET_ENABLED: 'true'
      REAL_RAZORPAY_TESTS_ENABLED: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm eval
      - run: pnpm build
